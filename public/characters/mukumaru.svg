<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#d9f99d" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#84cc16" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="1"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <rect x="6" y="6" width="244" height="244" rx="42" fill="none" stroke="#d9f99d" stroke-width="4" opacity="0.6"/>
  
  <!-- Outer circle glow -->
  <circle cx="128" cy="115" r="70" fill="#84cc16" opacity="0.35" filter="url(#glow)"/>
  <circle cx="128" cy="115" r="64" fill="#0f172a" stroke="#d9f99d" stroke-width="3"/>
  
  <!-- Emoji / Motif symbol -->
  <text x="128" y="132" font-size="64" text-anchor="middle" dominant-baseline="central">🛸</text>
  
  <!-- Name Label Plate -->
  <rect x="38" y="195" width="180" height="38" rx="12" fill="#05070c" stroke="#d9f99d" stroke-width="2" opacity="0.9"/>
  <text x="128" y="220" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">むくまる</text>
</svg>