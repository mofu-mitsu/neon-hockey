<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1045" />
      <stop offset="100%" stop-color="#050714" />
    </radialGradient>
    <radialGradient id="cyanPuck" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="40%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0891b2" />
    </radialGradient>
    <radialGradient id="pinkMallet" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="45%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#9d174d" />
    </radialGradient>
    <filter id="neonCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="neonPink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Cyber Shield -->
  <rect width="64" height="64" rx="16" fill="url(#bgGlow)" />
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="#00f0ff" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Center Court Arc / Table Lines -->
  <line x1="10" y1="32" x2="54" y2="32" stroke="#ff007f" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="3 3" />
  <circle cx="32" cy="32" r="14" stroke="#00f0ff" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Neon Mallet (Top Player) -->
  <g filter="url(#neonPink)">
    <circle cx="32" cy="22" r="10" fill="url(#pinkMallet)" />
    <circle cx="32" cy="22" r="5" fill="#fbcfe8" fill-opacity="0.85" />
    <circle cx="32" cy="22" r="2.5" fill="#ffffff" />
  </g>

  <!-- Neon Glowing Puck (Dynamic Fast Motion) -->
  <g filter="url(#neonCyan)">
    <!-- Motion trails -->
    <path d="M22 42 L28 41" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" opacity="0.5" />
    <circle cx="35" cy="43" r="6.5" fill="url(#cyanPuck)" stroke="#ffffff" stroke-width="1" />
    <circle cx="33.5" cy="41.5" r="2" fill="#ffffff" opacity="0.9" />
  </g>
</svg>
